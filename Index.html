<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Навигатор «Молодая семья: первые шаги»</title>
  <style>
    /* ===== Базовые стили и переменные ===== */
    :root {
      --primary: #005b4f;
      --primary-hover: #00473e;
      --bg: #f4f7f6;
      --text: #1a1a1a;
      --text-muted: #555;
      --card-bg: #ffffff;
      --border: #d1dcd9;
      --focus-ring: #ffbf47;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Шапка ===== */
    header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 800px;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ===== Сетка плиток ===== */
    .tiles-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }
    @media (min-width: 600px) {
      .tiles-grid { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 2rem; }
    }
    @media (min-width: 900px) {
      .tiles-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ===== Карточка-плитка ===== */
    .tile {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    .tile:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(0, 91, 79, 0.1);
      transform: translateY(-2px);
    }
    .tile:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .tile-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .tile-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      flex-grow: 1;
    }
    .tile-dot {
      width: 12px;
      height: 12px;
      background-color: var(--primary);
      border-radius: 50%;
      position: absolute;
      top: 20px;
      right: 20px;
    }

    /* ===== Модальное окно ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    /* Кнопка закрытия */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
    }
    .close-btn:hover, .close-btn:focus-visible {
      color: var(--text);
      background: #eef2f1;
      outline: 2px solid var(--focus-ring);
    }

    /* ===== Внутреннее содержимое модалок ===== */
    .modal-title {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 16px;
      padding-right: 32px;
    }

    /* Список вопросов */
    .questions-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .question-btn {
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .question-btn:hover {
      border-color: var(--primary);
      background: #e8f0ee;
    }
    .question-btn:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .question-btn::after {
      content: "→";
      color: var(--primary);
      font-weight: bold;
    }

    /* Карточка ответа */
    .answer-section {
      margin-bottom: 20px;
    }
    .answer-section h3 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .answer-section p {
      margin-bottom: 12px;
    }
    .answer-steps {
      padding-left: 20px;
      margin-bottom: 16px;
    }
    .answer-steps li {
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .docs-list {
      list-style-type: square;
      padding-left: 20px;
      margin-bottom: 16px;
      color: var(--text-muted);
    }
    .links-block {
      background: #e8f0ee;
      padding: 16px;
      border-radius: var(--radius);
      border-left: 4px solid var(--primary);
    }
    .links-block h4 {
      margin-bottom: 8px;
      font-size: 1rem;
    }
    .links-block a {
      display: inline-block;
      color: var(--primary);
      text-decoration: underline;
      margin-bottom: 8px;
      font-weight: 500;
      word-break: break-all;
    }
    .links-block a:hover {
      color: var(--primary-hover);
    }
    .links-block a:focus-visible {
      outline: 2px solid var(--focus-ring);
    }

    /* Кнопка "Назад" */
    .back-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      font-size: 0.95rem;
    }
    .back-btn:hover { text-decoration: underline; }
    .back-btn:focus-visible { outline: 2px solid var(--focus-ring); }
    .back-btn::before { content: "←"; margin-right: 8px; }

    /* Скрытие элементов */
    [hidden] { display: none !important; }
  </style>
</head>

    </div>

    // ==========================================
    // ЛОГИКА ПРИЛОЖЕНИЯ
    // ==========================================

    const tilesContainer = document.getElementById('tiles-container');
    const questionsModal = document.getElementById('questions-modal');
    const qModalTitle = document.getElementById('q-modal-title');
    const questionsList = document.getElementById('questions-list');
    
    const answerModal = document.getElementById('answer-modal');
    const aModalTitle = document.getElementById('a-modal-title');
    const answerText = document.getElementById('answer-text');
    const answerSteps = document.getElementById('answer-steps');
    const answerDocs = document.getElementById('answer-docs');
    const answerLinks = document.getElementById('answer-links');

    const closeQuestionsBtn = document.getElementById('close-questions');
    const closeAnswerBtn = document.getElementById('close-answer');
    const backToQuestionsBtn = document.getElementById('back-to-questions');

    let currentCategoryId = null;

    // 1. Рендер плиток на главной
    function renderTiles() {
      NAVIGATOR_DATA.forEach(category => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        btn.setAttribute('aria-label', `Открыть категорию: ${category.title}`);
        
        btn.innerHTML = `
          <span class="tile-dot" aria-hidden="true"></span>
          <span class="tile-title">${category.title}</span>
          <span class="tile-desc">${category.desc}</span>
        `;
        
        btn.addEventListener('click', () => openQuestions(category.id));
        tilesContainer.appendChild(btn);
      });
    }

    // 2. Открытие модалки со списком вопросов
    function openQuestions(categoryId) {
      const category = NAVIGATOR_DATA.find(c => c.id === categoryId);
      if (!category) return;

      currentCategoryId = categoryId;
      qModalTitle.textContent = category.title;
      
      questionsList.innerHTML = '';
      category.questions.forEach(q => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'question-btn';
        btn.textContent = q.title;
        btn.addEventListener('click', () => openAnswer(q.id));
        li.appendChild(btn);
        questionsList.appendChild(li);
      });

      questionsModal.classList.add('active');
      closeQuestionsBtn.focus();
    }

    // 3. Открытие карточки с ответом
    function openAnswer(questionId) {
      const category = NAVIGATOR_DATA.find(c => c.id === currentCategoryId);
      const question = category.questions.find(q => q.id === questionId);
      if (!question) return;

      aModalTitle.textContent = question.title;
      answerText.textContent = question.answer;

      // Рендер шагов
      answerSteps.innerHTML = '';
      question.steps.forEach(step => {
        const li = document.createElement('li');
        li.textContent = step;
        answerSteps.appendChild(li);
      });

      // Рендер документов
      answerDocs.innerHTML = '';
      question.docs.forEach(doc => {
        const li = document.createElement('li');
        li.textContent = doc;
        answerDocs.appendChild(li);
      });

      // Рендер ссылок
      answerLinks.innerHTML = '';
      question.links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url;
        a.textContent = link.text;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        answerLinks.appendChild(a);
        answerLinks.appendChild(document.createElement('br'));
      });

      questionsModal.classList.remove('active');
      answerModal.classList.add('active');
      backToQuestionsBtn.focus();
    }

    // 4. Закрытие модалок
    function closeModal(modal) {
      modal.classList.remove('active');
      if (modal === questionsModal) {
        const activeTile = Array.from(tilesContainer.children).find(btn => 
          btn.getAttribute('aria-label').includes(NAVIGATOR_DATA.find(c => c.id === currentCategoryId).title)
        );
        if (activeTile) activeTile.focus();
      }
    }

    closeQuestionsBtn.addEventListener('click', () => closeModal(questionsModal));
    closeAnswerBtn.addEventListener('click', () => {
      answerModal.classList.remove('active');
    });

    backToQuestionsBtn.addEventListener('click', () => {
      answerModal.classList.remove('active');
      questionsModal.classList.add('active');
      const firstQ = questionsList.querySelector('.question-btn');
      if (firstQ) firstQ.focus();
    });

    [questionsModal, answerModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (answerModal.classList.contains('active')) {
          answerModal.classList.remove('active');
          questionsModal.classList.add('active');
        } else if (questionsModal.classList.contains('active')) {
          closeModal(questionsModal);
        }
      }
    });

    renderTiles();
  </script>
